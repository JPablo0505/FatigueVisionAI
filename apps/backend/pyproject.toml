[project]
name = "fatiguevision-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "fatiguevision-vision-engine",
    "fatiguevision-ai-engine",
    "fatiguevision-feature-extractor",
    "pydantic-settings>=2.4",
]

[tool.uv.sources]
fatiguevision-vision-engine = { path = "../../packages/vision-engine" }
fatiguevision-ai-engine = { path = "../../packages/ai-engine" }
fatiguevision-feature-extractor = { path = "../../packages/feature-extractor" }

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "mypy>=1.11",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

# The engine packages ship without a py.typed marker; their internal
# mediapipe/cv2 deps have no stubs. We treat them as untyped at the boundary
# and cast at our call sites. Do NOT loosen strict for backend code.
[[tool.mypy.overrides]]
module = [
    "ai_engine",
    "ai_engine.*",
    "vision_engine",
    "vision_engine.*",
    "feature_extractor",
    "feature_extractor.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]