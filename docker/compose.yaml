# Nota: el servicio de PostgreSQL se agrega en el sprint de base de datos.
services:
  backend:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: ../.env
        required: false
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/healthz').status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s